<section class="institution-directory" aria-labelledby="institutions-title">
  <h2 class="directory-heading" id="institutions-title">Education &amp; Experience</h2>
  <nav class="institution-logo-grid" aria-label="Institutions from my education and work experience">
    {% for institution in site.data.institutions %}
    <a href="{{ institution.url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ institution.name }} — official website (opens in a new tab)">
      <span class="institution-mark{% if institution.logo_shape == 'seal' %} institution-mark--seal{% endif %}{% if institution.logo_surface == 'navy' %} institution-mark--navy{% endif %}"><img src="{{ institution.logo | relative_url }}" alt="" loading="lazy" decoding="async"></span>
      <span class="institution-caption">{{ institution.label }} <span aria-hidden="true">↗</span></span>
      <span class="institution-translation" lang="zh-CN">{{ institution.chinese }}</span>
    </a>
    {% endfor %}
  </nav>
  <p class="institution-note">Personal education and work history — not institutional partnerships or endorsements.</p>
</section>
