<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url != '/' %}{{ page.title | strip_html | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
    <meta name="author" content="{{ site.author.name | escape }}">
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
    <meta property="og:image" content="{{ '/assets/images/elvis-avatar.png' | absolute_url }}">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="{{ '/assets/images/elvis-phoenix-logo.png' | relative_url }}" type="image/png">
    <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title | escape }}">
    <script src="{{ '/assets/js/academic-style.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/scholar-polish.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" href="{{ '/assets/css/researcher.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script src="{{ '/assets/js/scholar.js' | relative_url }}" defer></script>
  </head>
  <body>
    <div class="scholar-backdrop" aria-hidden="true"></div>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="nav-name nav-brand" href="{{ '/' | relative_url }}" aria-label="Elvis Han Cui — About"><img class="personal-logo" src="{{ '/assets/images/elvis-phoenix-logo.png' | relative_url }}" alt="" width="1254" height="1254"><span class="brand-wordmark"><span><strong>Elvis Han</strong> Cui</span><span class="brand-chinese" lang="zh-CN">崔涵</span></span></a>
        <div class="nav-links">
          {% for item in site.data.navigation.main %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active" aria-current="page"{% elsif page.nav_parent == item.url %} class="active"{% endif %}>{{ item.title }}</a>
          {% endfor %}
        </div>
        <div class="appearance-tools">
          <button id="appearance-toggle" class="appearance-toggle" type="button" data-appearance="ink" aria-label="Appearance: Ink &amp; Paper. Switch to Day." title="Ink &amp; Paper → Day" hidden>
            <svg class="appearance-glyph glyph-ink" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M4 19h16M3 16l5-8 4 6 3-4 6 9M7 10l1 2 1-1"/><circle cx="17.5" cy="5.5" r="2"/></svg>
            <svg class="appearance-glyph glyph-day" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
            <svg class="appearance-glyph glyph-night" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M20.7 14.4A9 9 0 0 1 9.6 3.3a9 9 0 1 0 11.1 11.1Z"/></svg>
          </button>
        </div>
      </nav>
    </header>
    <main id="main" class="site-main" tabindex="-1">{{ content }}</main>
    <footer class="site-footer">
      <nav class="archive-links" aria-label="More pages">
        <a href="{{ '/teaching/' | relative_url }}">Teaching</a>
        <a href="{{ '/writing/' | relative_url }}">Writing</a>
        <a href="{{ '/friends/' | relative_url }}">External Links</a>
        <a href="{{ '/sitemap/' | relative_url }}">Sitemap</a>
      </nav>
      <p>© {{ site.time | date: '%Y' }} {{ site.author.name }} <span aria-hidden="true">·</span> Hangzhou, China</p>
    </footer>
  </body>
</html>
